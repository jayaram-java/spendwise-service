server:
  port: 8086
  servlet:
    context-path: /expenseservice

spring:
  application:
    name: spendwise-service
  cloud:
    discovery:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/personalhubmgmt?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: ${app.storage.receipt.max-file-size}
      max-request-size: ${app.storage.receipt.max-request-size}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

app:
  encryption:
    enabled: ${WEALTHTRACKER_ENCRYPTION_ENABLED:false}
    key: ${WEALTHTRACKER_ENCRYPTION_KEY:}
  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173"
  security:
    actuator-open: true
  storage:
    receipt:
      base-path: ${RECEIPT_STORAGE_PATH:./storage/receipts}
      max-file-size: ${RECEIPT_MAX_FILE_SIZE:15728640}
      max-files: ${RECEIPT_MAX_FILES:10}
      max-request-size: ${RECEIPT_MAX_REQUEST_SIZE:157286400}
      allowed-content-types:
        - application/pdf
        - image/jpeg
        - image/png

security:
  jwt:
    secret: 4Dg8b9n6G1JQZJX2t2lP3d0fKc9v6d8xq0Lk5m3v2wA=

logging:
  file:
    path: ${LOG_PATH:${LOG_BASE_PATH:./logs}}
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.kafka: INFO
    com.jayaram: DEBUG

info:
  app:
    name: ${spring.application.name}
    description: Expense Management Service
    version: ${APP_VERSION:0.0.1-SNAPSHOT}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  prometheus:
    metrics:
      export:
        enabled: true
